[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uitap"
version = "0.1.0"
description = "uiautomator2-style iOS UI automation client"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CoconutHR" }]
keywords = ["ios", "automation", "ui-automation", "uiautomator2", "device-testing", "uitap"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
vision = ["Pillow>=9.0", "opencv-python-headless>=4.5"]

[project.urls]
Homepage = "https://github.com/CoconutHR/uitap"
Repository = "https://github.com/CoconutHR/uitap"
Issues = "https://github.com/CoconutHR/uitap/issues"

[project.scripts]
ut = "uitap.cli:main"
uitap = "uitap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uitap = ["py.typed", "inspector/*.html"]